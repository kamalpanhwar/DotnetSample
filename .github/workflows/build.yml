name: Build setup
on: [push]

jobs:
  container-build-job:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/dotnet/sdk:6.0
    steps:
      - name: get project
        uses: actions/checkout@v3
        with:
          ref: 'main'
          fetch-depth: '1'

      - name: Build
        run: dotnet build

      - name: Test
        run: dotnet test --no-build --verbosity normal

  report:
    if: ${{ always() }}
    needs: build
    uses: ./.github/workflows/report.yml
